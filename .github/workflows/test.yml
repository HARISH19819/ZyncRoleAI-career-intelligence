name: Backend Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Python Tests & Agent Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest & Agents Verification
        env:
          SUPABASE_DB_URL: "sqlite+aiosqlite:///./test_zyncrole.db"
          JWT_SECRET: "ci-test-secret-key-minimum-32-chars-long-12345"
          ATS_RESUME_BUILDER_URL: "https://open-resume.com"
        run: |
          pytest backend/tests/ -v
